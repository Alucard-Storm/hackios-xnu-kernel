# Per-device settings: read by mkxnuimg.py, tools/update-prebuilt.sh, tools/modem-cycle.sh and the Makefile.
# KEY=VALUE, one per line (also valid shell).
CODENAME=raphael
# Where the boot shim puts the UEFI image and the "XNUP" payload (this phone's memory map).
# FD: the stock UEFI's own load segment in xbl.img (ELF segment 11, PA 0x9fc00000, 3 MB), just below
#     the xbl header segment at 0x9ff00000. Confirmed by a UEFI that boots this phone (the edk2-msm
#     SurfaceDuo1Pkg image, a Mu-Silicium-style boot shim): its 112-byte shim loads a 3 MB FD to 0x9fc00000.
# PAYLOAD: inside the 0xc0000000-0x1ffffffff System RAM block, clear of every reserved-memory node
#     in the device tree. The payload address is derived from the device tree, not yet booted.
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
# what `make phone` runs. No cpufreq= (the POCO's clock registers), no gpu= (the Adreno 640's bring-up is not finished: see README.md),
# touchscreen=2 is this phone's I2C touch screen, battery=1 the charger state. Sessions are short: nothing here throttles the CPU
# and the picture is drawn in software, so the phone gets warm; 180 s is a comfortable look.
BASE_ARGS=debug=0x8 rd=md0 hv_wdt_pet=1 bootcpu=7 cpus=8 ufs=2
PHONE_ARGS=touchscreen=2 battery=1
PHONE_SECS=180
