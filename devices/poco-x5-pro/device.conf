# Per-device build settings: read by mkxnuimg.py, tools/update-prebuilt.sh, tools/modem-cycle.sh.
# KEY=VALUE, one per line (also valid shell).
CODENAME=redwood
# where the boot shim puts the UEFI image and the "XNUP" payload (the phone's memory map)
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000
