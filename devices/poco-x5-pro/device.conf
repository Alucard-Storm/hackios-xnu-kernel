# Per-device settings: read by mkxnuimg.py, tools/update-prebuilt.sh, tools/modem-cycle.sh and the Makefile.
# KEY=VALUE, one per line (also valid shell).
CODENAME=redwood
# where the boot shim puts the UEFI image and the "XNUP" payload (the phone's memory map)
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000
# what `make phone` runs: the arguments every run of this phone has, the ones for the drivers it has, and how long a session lasts
BASE_ARGS=debug=0x8 rd=md0 hv_wdt_pet=1 bootcpu=7 cpus=8 cpufreq=1 ufs=2
PHONE_ARGS=touchscreen=1 gpu=1 adsp=1 sound=4 wifi=1 haptic=5 modem=1 modem_again=1 modem_buffer=0xa8000000
PHONE_SECS=600
